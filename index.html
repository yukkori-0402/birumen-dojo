<title>ビルメン資格道場</title><meta name="description" content="電工二種・ボイラー2級・ビル管理士・電験三種の過去問を、スマホで無料で練習できるアプリ。現場12年のビルメンが作りました。">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
/* 中央監視盤アーケード:夜の監視室の盤面。ランプ・LED表示・注意テープで、ビルメンの現場をゲームにする(ひとつの世界観に決めた暗い配色) */
:root{
  color-scheme:dark;
  --bg:#0b1322; --panel:#132038; --panel2:#1a2a47; --line:#2b4068; --ink:#eef3ff; --sub:#9db0d0;
  --yellow:#ffd21f; --yellow-ink:#16120a; --green:#35e07a; --red:#ff5468; --amber:#ff9d2e; --cyan:#45d3ff; --violet:#c79bff;
  --glow-g:0 0 10px #35e07a99; --glow-r:0 0 10px #ff546899; --glow-y:0 0 14px #ffd21f88;
  --f-disp:"Dela Gothic One","Zen Kaku Gothic New","Hiragino Sans",sans-serif;
  --f-led:"DotGothic16","Zen Kaku Gothic New",monospace;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100%;background:radial-gradient(1200px 500px at 50% -120px,#1d3563 0,transparent 70%),repeating-linear-gradient(0deg,#ffffff05 0 1px,transparent 1px 4px),var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7}
.tape{height:14px;background:repeating-linear-gradient(-45deg,var(--yellow) 0 14px,#121212 14px 28px);box-shadow:0 2px 0 #0006}
.wrap{max-width:600px;margin:0 auto;padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,.disp{font-family:var(--f-disp);font-weight:400;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.led{font-family:var(--f-led);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.lbl{font-family:var(--f-led);font-size:12px;letter-spacing:.18em;color:var(--sub)}

/* ホーム */
.hero{position:relative;padding:22px 18px 20px;margin:6px 0 20px;border:2px solid var(--line);border-radius:18px;background:linear-gradient(180deg,var(--panel2),var(--panel));overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,#ffd21f33,transparent 70%)}
.hero .lbl{display:flex;align-items:center;gap:8px}
.lamp{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:var(--glow-g)}
.hero h1{font-size:clamp(34px,10vw,52px);line-height:1.15;margin:8px 0 6px;color:var(--yellow);text-shadow:0 3px 0 #a37e00,0 0 22px #ffd21f55}
.hero h1 small{display:block;font-size:.42em;color:var(--ink);text-shadow:none;letter-spacing:.08em}
.hero p{margin:0;color:var(--sub);font-size:14.5px}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 10px}
.sec h2{font-size:20px}
.stages{display:grid;gap:12px}
.stage{--c:var(--cyan);position:relative;display:grid;grid-template-columns:62px 1fr auto;gap:14px;align-items:center;width:100%;padding:14px 14px 14px 12px;text-align:left;border:2px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:0 4px 0 #050a14;transition:transform .12s,border-color .12s}
.stage:hover{border-color:var(--c)}
.stage:active{transform:translateY(3px);box-shadow:0 1px 0 #050a14}
.stage .ic{width:62px;height:62px;border-radius:14px;display:grid;place-items:center;font-family:var(--f-disp);font-size:26px;color:#0b1322;background:var(--c);box-shadow:inset 0 -5px 0 #0003,0 0 18px color-mix(in srgb,var(--c) 45%,transparent)}
.stage b{display:block;font-size:17.5px;line-height:1.35}
.stage small{display:block;color:var(--sub);font-size:13px;line-height:1.5;margin-top:2px}
.stage .hi{min-width:64px;text-align:center;padding:6px 8px;border-radius:10px;background:#050b16;border:1px solid var(--line)}
.stage .hi span{display:block;font-size:10.5px;color:var(--sub);letter-spacing:.1em}
.stage .hi strong{display:block;font-family:var(--f-led);font-size:20px;font-weight:400;color:var(--c);text-shadow:0 0 8px color-mix(in srgb,var(--c) 60%,transparent)}
.diff{display:block;margin-top:4px;font-size:12px;color:var(--sub);line-height:1.5}
.stars{color:var(--c);letter-spacing:1px;margin-right:6px;font-size:13px}.stars i{font-style:normal;color:#2b4068}
.origin{margin:-2px 0 12px;padding:8px 12px;border-radius:10px;border:1px dashed var(--line);font-size:12.5px;color:var(--sub);line-height:1.6}
.stage .cnt{color:var(--c);font-weight:700;margin-top:0}
.stage.mix{--c:var(--violet);background:linear-gradient(90deg,#251c3a,var(--panel) 60%)}
.apps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.app{--c:var(--cyan);display:grid;gap:4px;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--panel);color:var(--ink);text-decoration:none;min-width:0;transition:border-color .12s,transform .12s}
.app:hover{border-color:var(--c);transform:translateY(-2px)}
.app b{font-size:15.5px;line-height:1.35}
.app .n{font-family:var(--f-led);font-size:22px;color:var(--c);line-height:1.2}
.app small{color:var(--sub);font-size:12.5px;line-height:1.5}
.app .go{font-size:12.5px;font-weight:700;color:var(--c)}
.note{font-size:12.5px;color:var(--sub);margin-top:18px;line-height:1.65}
.foot{text-align:center;font-size:12px;color:var(--sub);margin-top:26px}
.mt{margin-top:28px}

/* 問題 */
.hud{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;margin-bottom:12px}
.quit{background:none;border:1px solid var(--line);border-radius:10px;color:var(--sub);font-size:13px;padding:6px 10px}
.score{justify-self:end;padding:4px 12px;border-radius:10px;background:#050b16;border:1px solid var(--line);font-size:20px;color:var(--yellow);text-shadow:var(--glow-y)}
.score span{font-size:11px;color:var(--sub);margin-right:6px;letter-spacing:.12em;text-shadow:none}
.combo{justify-self:center;font-family:var(--f-disp);font-size:15px;color:var(--amber);opacity:0;transform:scale(.8);transition:.15s}
.combo.on{opacity:1;transform:none;text-shadow:0 0 12px #ff9d2e99}
.combo.fire{color:var(--yellow)}
.lamps{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-bottom:16px;padding:10px;border-radius:12px;background:#050b16;border:1px solid var(--line)}
.lamps i{aspect-ratio:1;max-width:100%;border-radius:50%;background:#1b2740;box-shadow:inset 0 2px 3px #0008}
.lamps i.ok{background:var(--green);box-shadow:var(--glow-g)}
.lamps i.ng{background:var(--red);box-shadow:var(--glow-r)}
.lamps i.now{background:#1b2740;box-shadow:inset 0 0 0 3px var(--yellow)}
.qcard{position:relative;padding:20px 18px 18px;border-radius:18px;border:2px solid var(--line);background:linear-gradient(180deg,var(--panel2),var(--panel))}
.qno{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.qno .disp{font-size:20px}
.tag{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;color:#0b1322;background:var(--c,var(--cyan))}
.q{font-size:18px;font-weight:700;line-height:1.65;margin:0 0 16px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:#0e1930;font-size:16px;font-weight:500;min-height:56px;box-shadow:0 3px 0 #050a14;transition:transform .08s,border-color .12s}
.opt:hover:not(:disabled){border-color:var(--cyan)}
.opt:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.opt .k{flex:none;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);font-family:var(--f-led);font-size:16px}
.opt.ok{border-color:var(--green);background:#0f2f22;box-shadow:var(--glow-g)}.opt.ok .k{background:var(--green);color:#0b1322;border-color:var(--green)}
.opt.ng{border-color:var(--red);background:#331520}.opt.ng .k{background:var(--red);color:#fff;border-color:var(--red)}
.opt:disabled{cursor:default}.opt.dim{opacity:.45}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.flash{position:fixed;inset:0;pointer-events:none;z-index:20;animation:flash .45s ease-out forwards}
.flash.ok{background:radial-gradient(circle,#35e07a33,transparent 70%)}.flash.ng{background:radial-gradient(circle,#ff546833,transparent 70%)}
@keyframes flash{from{opacity:1}to{opacity:0}}
.plus{position:absolute;right:16px;top:14px;font-family:var(--f-led);font-size:22px;color:var(--green);text-shadow:var(--glow-g);animation:up .9s ease-out forwards;pointer-events:none}
@keyframes up{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-36px)}}
.exp{margin-top:16px;padding:14px 16px;border-radius:14px;background:#050b16;border:1px solid var(--line);font-size:15px}
.exp .r{font-family:var(--f-disp);font-size:22px;margin-bottom:4px}
.exp .r.ok{color:var(--green);text-shadow:var(--glow-g)}.exp .r.ng{color:var(--red);text-shadow:var(--glow-r)}
.next{display:block;width:100%;margin-top:14px;padding:15px;border:none;border-radius:14px;background:var(--yellow);color:var(--yellow-ink);font-family:var(--f-disp);font-size:18px;box-shadow:0 4px 0 #a37e00}
.next:active{transform:translateY(3px);box-shadow:0 1px 0 #a37e00}

/* 結果 */
.result{position:relative;padding:24px 18px;border-radius:18px;border:2px solid var(--line);background:linear-gradient(180deg,var(--panel2),var(--panel));text-align:center;overflow:hidden}
.stamp{width:156px;height:156px;margin:8px auto 12px;border-radius:50%;border:6px double var(--red);color:var(--red);display:grid;place-content:center;transform:rotate(-8deg);animation:stamp .4s cubic-bezier(.2,1.6,.4,1);text-shadow:0 0 12px #ff546866}
.stamp.good{border-color:var(--yellow);color:var(--yellow);text-shadow:var(--glow-y)}
.stamp div{font-family:var(--f-disp);font-size:46px;line-height:1}
.stamp small{display:block;font-size:13px;font-weight:700;letter-spacing:.1em;margin-top:4px}
@keyframes stamp{from{transform:rotate(-8deg) scale(2);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
.rank{font-size:26px;margin-bottom:4px}
.rank-sub{color:var(--sub);margin:0 0 14px;font-size:14px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{padding:13px;border-radius:14px;border:2px solid var(--line);background:#0e1930;font-weight:700;text-decoration:none;color:var(--ink);text-align:center;font-size:15px}
.btn.x{background:var(--ink);color:#0b1322;border-color:var(--ink)}
.btn.wide{width:100%;margin-top:10px}
.miss{margin-top:20px;text-align:left}
.miss h2{font-size:17px;margin-bottom:8px;color:var(--amber)}
.miss ul{padding-left:1.2em;margin:0}
.miss li{margin-bottom:10px;font-size:14.5px}
.miss li b{display:block}
.book{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:16px;margin-top:16px;border-radius:16px;border:2px solid var(--line);background:var(--panel);text-align:left;text-decoration:none;color:var(--ink)}
.book .cv{width:58px;height:82px;border-radius:4px;background:linear-gradient(160deg,var(--yellow) 0 48%,#1f3550 48%);display:grid;place-items:end center;padding-bottom:6px;color:#fff;font-size:10px;font-weight:900}
.book b{display:block;font-size:15.5px;line-height:1.45}
.book small{color:var(--sub);font-size:13px;line-height:1.5;display:block;margin-top:3px}
.book .go{font-size:13px;font-weight:700;color:var(--cyan);margin-top:4px;display:block}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
.pop{animation:pop .25s ease-out}@keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}}
@media (max-width:420px){.apps{grid-template-columns:1fr}.stage{grid-template-columns:54px 1fr auto;gap:12px}.stage .ic{width:54px;height:54px;font-size:22px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

 den:{name:'第二種電気工事士',short:'電工二種',ic:'電',c:'var(--cyan)',lv:2,rate:'学科 約57%・技能 約72%(2025年度)',desc:'法令・接地・配線の基本',qs:[

  ['20Aの配線用遮断器の分岐回路で使う電線(銅線)の太さは?',['直径1.6mm以上','直径1.2mm以上','直径2.6mm以上','直径3.2mm以上'],'20Aの遮断器には1.6mm以上の電線、20A以下のコンセントを組み合わせます。'],
  ['30Aの配線用遮断器の分岐回路につなげるコンセントは?',['20A以上30A以下','15Aのみ','15A以上20A以下','30A以上50A以下'],'30Aの回路は電線2.6mm以上、コンセントは20A以上30A以下です。'],

  ['第二種電気工事士の免状を交付するのは?',['都道府県知事','経済産業大臣','市町村長','電力会社'],'電気工事士法で、第一種・第二種とも都道府県知事が交付すると決められています。'],
  ['絶縁抵抗を測るときに使う測定器は?',['絶縁抵抗計(メガー)','接地抵抗計(アーステスタ)','クランプメータ','検相器'],'接地抵抗計は接地の抵抗、検相器は三相の相の順番を調べる道具です。'],
 ]},
 boiler:{name:'2級ボイラー技士',short:'ボイラー2級',ic:'缶',c:'var(--amber)',lv:2,rate:'約54%(2024年度)',desc:'構造・取扱い・燃焼・法令',qs:[
  ['燃料を燃やすときの「空気比」の求め方は?',['実際空気量÷理論空気量','理論空気量÷実際空気量','実際空気量−理論空気量','理論空気量×実際空気量'],'実際に送りこんだ空気が、理論上ちょうど必要な量の何倍かを表します。'],

const N=10, $=document.getElementById('app');
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;

function home(){

  $.innerHTML=`<div class="pop">
  <section class="hero"><span class="lbl"><i class="lamp"></i>4択 ・ 1回10問</span><h1><small>ビルメンの資格を、ゲームで</small>ビルメン資格道場</h1><p>4択10問で腕だめし。まちがえた問題は、あとで解説つきで見直せます。</p></section>

  <div class="apps">${APPS.map(a=>`<a class="app" href="${a.href}" style="--c:${a.c}"><b>${a.name}</b><span class="n">${a.n}</span><small>${a.d}</small><span class="go">開く →</span></a>`).join('')}</div>

function start(id){
  const tagged=([k,c])=>c.qs.map(q=>[...q,c.short,c.c]);
  const pool=id==='mix'?Object.entries(COURSES).flatMap(tagged):tagged([id,COURSES[id]]);
  S={id,qs:shuffle(pool).slice(0,N).map(([q,o,e,tag,c])=>({q,e,tag,c,a:o[0],o:shuffle(o)})),i:0,res:[],combo:0,maxCombo:0};
  ask();
}

function hud(){
  return `<div class="hud"><button class="quit" id="quit">← やめる</button><span class="combo${S.combo>=2?' on':''}${S.combo>=5?' fire':''}" id="combo">${S.combo>=2?S.combo+'連続!':''}</span><span class="score led">${S.i+1}/${N}問</span></div>
  <div class="lamps">${S.qs.map((_,k)=>`<i class="${k<S.res.length?(S.res[k]?'ok':'ng'):k===S.i?'now':''}"></i>`).join('')}</div>`;
}

function ask(){
  const Q=S.qs[S.i];
  $.innerHTML=`${hud()}<div class="qcard pop" id="card"><div class="qno"><span class="disp">第${S.i+1}問</span><span class="tag" style="--c:${Q.c}">${Q.tag}</span></div>
  <p class="q">${Q.q}</p><div class="opts">${Q.o.map((o,k)=>`<button class="opt" data-k="${k}"><span class="k">${'ABCD'[k]}</span><span>${o}</span></button>`).join('')}</div><div id="after"></div></div>`;
  document.getElementById('quit').onclick=home;
  $.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  window.scrollTo(0,0);
}

function flash(kind){const f=document.createElement('div');f.className='flash '+kind;document.body.appendChild(f);setTimeout(()=>f.remove(),500);}

function answer(k){
  const Q=S.qs[S.i], ok=Q.o[k]===Q.a, bs=$.querySelectorAll('.opt'), card=document.getElementById('card');
  bs.forEach((b,j)=>{b.disabled=true;if(Q.o[j]===Q.a)b.classList.add('ok');else if(j===k)b.classList.add('ng');else b.classList.add('dim')});
  S.res.push(ok); S.combo=ok?S.combo+1:0; S.maxCombo=Math.max(S.maxCombo,S.combo);
  if(ok){const p=document.createElement('span');p.className='plus';p.textContent='正解';card.appendChild(p);flash('ok');}
  else{card.classList.add('shake');flash('ng');}
  if(navigator.vibrate)try{navigator.vibrate(ok?30:[60,40,60])}catch(e){}
  const cb=document.getElementById('combo');cb.className='combo'+(S.combo>=2?' on':'')+(S.combo>=5?' fire':'');cb.textContent=S.combo>=2?S.combo+'連続!':'';
  const lamps=$.querySelectorAll('.lamps i');lamps[S.i].className=ok?'ok':'ng';
  const last=S.i===N-1;
  document.getElementById('after').innerHTML=`<div class="exp pop"><div class="r ${ok?'ok':'ng'}">${ok?'正解!':'ざんねん'}</div>${ok?'':'答え:<b>'+Q.a+'</b><br>'}${Q.e}</div><button class="next" id="next">${last?'結果を見る':'次の問題へ'}</button>`;
  document.getElementById('next').onclick=()=>{S.i++;last?result():ask()};
  document.getElementById('next').scrollIntoView({behavior:calm?'auto':'smooth',block:'nearest'});
}

function confetti(){
  if(calm)return;
  const cv=document.getElementById('fx'), x=cv.getContext('2d');cv.hidden=false;
  const W=cv.width=innerWidth, H=cv.height=innerHeight, cols=['#ffd21f','#35e07a','#45d3ff','#ff9d2e','#ff5468'];
  const ps=Array.from({length:120},()=>({x:Math.random()*W,y:-20-Math.random()*H*.5,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,r:Math.random()*6.28,s:5+Math.random()*6,c:cols[Math.random()*5|0]}));
  let t=0;(function f(){x.clearRect(0,0,W,H);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++t<170)requestAnimationFrame(f);else{x.clearRect(0,0,W,H);cv.hidden=true}})();
}

function result(){
  const score=S.res.filter(Boolean).length, r=RANKS.find(x=>score>=x[0]);

  $.innerHTML=`<div class="result pop"><span class="lbl">${cname}の結果</span>
  <div class="stamp${score>=8?' good':''}"><div>${score}<span style="font-size:22px">/${N}</span></div><small>${isBest?'自己ベスト':'正解'}</small></div>

  </div>
  <a class="book" href="${book.u}" target="_blank" rel="noopener"><span class="cv">${book.v}</span><span><span class="lbl">現場の話は本でも</span><b>${book.t}</b><small>${book.s}</small><span class="go">Amazonで見る →</span></span></a>
