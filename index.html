<style>
/* 白基調のシンプルなデザイン。資格ごとの色は、それぞれの過去問アプリと同じ */
:root{
  color-scheme:light dark;
  --bg:#e8e5de; --paper:#f3f0e9; --ink:#2a2f33; --sub:#6f716c; --line:#dad5ca; --line2:#c9c3b6; --soft:#e4dfd4;
  --den:#16b37e; --boiler:#f07818; --kan:#10a5d6; --denken:#3556b8; --mix:#8b5cf6;
  --ok:#16b37e; --ng:#e5484d; --gold:#f5b301;
  --f-num:"Nunito","M PLUS Rounded 1c",sans-serif;
  --f-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --shadow:0 1px 2px rgba(60,50,30,.06),0 6px 18px rgba(60,50,30,.06);
}
/* スマホがダークモードのときは、落ち着いた墨色に */
@media (prefers-color-scheme:dark){:root{
  --bg:#15191e; --paper:#1e242b; --ink:#e6ebee; --sub:#97a3ac; --line:#2c343c; --line2:#3b4550; --soft:#272e36;
  --kan:#2bb5e3; --denken:#7b97f0; --mix:#a78bfa;
  --shadow:0 1px 0 rgba(255,255,255,.03);
}}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
.tape{display:none}
.wrap{max-width:640px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,.disp{font-weight:800;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--kan);outline-offset:2px}
.led{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.lbl{font-size:12.5px;font-weight:700;color:var(--sub)}

/* ホーム */
.hero{position:relative;padding:26px 22px 22px;margin:4px 0 26px;border-radius:24px;background:var(--paper);box-shadow:var(--shadow);overflow:hidden}
.hero::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,var(--den) 0 25%,var(--boiler) 25% 50%,var(--kan) 50% 75%,var(--denken) 75%)}
.hero .lbl{display:inline-block;padding:3px 12px;border-radius:99px;background:var(--soft);color:var(--sub)}
.lamp{display:none}
.hero h1{font-size:clamp(30px,8.6vw,42px);line-height:1.25;margin:12px 0 8px;letter-spacing:.01em;font-weight:900}
.hero h1 small{display:block;font-size:.4em;font-weight:700;color:var(--sub);letter-spacing:.04em;margin-bottom:4px}
.hero p{margin:0;color:var(--sub);font-size:14.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{display:flex;align-items:baseline;gap:4px;padding:8px 12px;border-radius:14px;background:var(--soft);font-size:12.5px;color:var(--sub);font-weight:700}
.chip b{font-family:var(--f-num);font-size:20px;color:var(--ink);line-height:1}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 12px}
.sec h2{font-size:19px}
.mt{margin-top:32px}
.apps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.app{--c:var(--kan);position:relative;display:grid;gap:2px;align-content:start;padding:16px 16px 14px;border-radius:20px;background:var(--paper);box-shadow:var(--shadow);color:var(--ink);text-decoration:none;min-width:0;border:2px solid transparent;transition:transform .12s,border-color .12s}
.app:hover{border-color:color-mix(in srgb,var(--c) 40%,transparent);transform:translateY(-2px)}
.app .ai{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:900;font-size:19px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,var(--paper));margin-bottom:8px}
.app b{font-size:15.5px;line-height:1.4}
.app .n{font-family:var(--f-num);font-size:26px;font-weight:900;color:var(--c);line-height:1.25}
.app .n small{font-family:var(--f-body);font-size:13px;margin-left:2px;color:var(--c)}
.app small{color:var(--sub);font-size:12.5px;line-height:1.55}
.app .go{margin-top:8px;font-size:13px;font-weight:800;color:var(--c)}
.origin{margin:-2px 0 12px;font-size:12.5px;color:var(--sub);line-height:1.6}
.stages{display:grid;gap:10px}
.stage{--c:var(--kan);position:relative;display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;width:100%;padding:14px;text-align:left;border:2px solid transparent;border-radius:20px;background:var(--paper);box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.stage:hover{border-color:color-mix(in srgb,var(--c) 40%,transparent)}
.stage:active{transform:scale(.99)}
.stage .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-weight:900;font-size:22px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,var(--paper))}
.stage b{display:block;font-size:16.5px;line-height:1.35}
.stage small{display:block;color:var(--sub);font-size:12.5px;line-height:1.5;margin-top:2px}
.stage .cnt{color:var(--c);font-weight:800}
.stage .hi{min-width:62px;text-align:center;padding:6px 8px;border-radius:14px;background:var(--soft)}
.stage .hi span{display:block;font-size:10.5px;color:var(--sub);font-weight:700}
.stage .hi strong{display:block;font-family:var(--f-num);font-size:20px;font-weight:900;color:var(--c);line-height:1.3}
.stage.mix{--c:var(--mix)}
.diff{display:block;margin-top:4px;font-size:12px;color:var(--sub);line-height:1.5}
.stars{color:var(--gold);letter-spacing:1px;margin-right:6px;font-size:12.5px}.stars i{font-style:normal;color:var(--line2)}
.note{font-size:12px;color:var(--sub);margin-top:20px;line-height:1.7}
.foot{text-align:center;font-size:12px;color:var(--sub);margin-top:28px;line-height:1.9}
.foot a{color:var(--sub)}

/* 問題 */
.hud{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;margin-bottom:12px}
.quit{background:var(--paper);border:1px solid var(--line);border-radius:99px;color:var(--sub);font-size:13px;font-weight:700;padding:7px 14px}
.score{justify-self:end;padding:4px 12px;border-radius:99px;background:var(--paper);border:1px solid var(--line);font-size:16px;font-weight:900;color:var(--ink)}
.combo{justify-self:center;font-weight:900;font-size:15px;color:var(--boiler);opacity:0;transform:scale(.8);transition:.15s}
.combo.on{opacity:1;transform:none}
.combo.fire{color:var(--ng)}
.lamps{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-bottom:16px}
.lamps i{height:8px;border-radius:99px;background:var(--line)}
.lamps i.ok{background:var(--ok)}
.lamps i.ng{background:var(--ng)}
.lamps i.now{background:var(--ink)}
.qcard{position:relative;padding:22px 18px 18px;border-radius:24px;background:var(--paper);box-shadow:var(--shadow)}
.qno{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.qno .disp{font-size:15px;color:var(--sub)}
.tag{font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px;color:var(--c,var(--kan));background:color-mix(in srgb,var(--c,var(--kan)) 13%,var(--paper))}
.q{font-size:18px;font-weight:800;line-height:1.65;margin:0 0 16px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;border-radius:16px;border:2px solid var(--line);background:var(--paper);font-size:16px;font-weight:500;min-height:56px;transition:transform .08s,border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--line2);background:var(--soft)}
.opt:active:not(:disabled){transform:scale(.99)}
.opt .k{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--soft);font-family:var(--f-num);font-weight:900;font-size:15px;color:var(--sub)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,var(--paper))}.opt.ok .k{background:var(--ok);color:#fff}
.opt.ng{border-color:var(--ng);background:color-mix(in srgb,var(--ng) 8%,var(--paper))}.opt.ng .k{background:var(--ng);color:#fff}
.opt:disabled{cursor:default}.opt.dim{opacity:.45}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.flash{position:fixed;inset:0;pointer-events:none;z-index:20;animation:flash .45s ease-out forwards}
.flash.ok{background:radial-gradient(circle,#16b37e1f,transparent 70%)}.flash.ng{background:radial-gradient(circle,#e5484d1f,transparent 70%)}
@keyframes flash{from{opacity:1}to{opacity:0}}
.plus{position:absolute;right:18px;top:16px;font-weight:900;font-size:18px;color:var(--ok);animation:up .9s ease-out forwards;pointer-events:none}
@keyframes up{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-30px)}}
.exp{margin-top:16px;padding:14px 16px;border-radius:16px;background:var(--soft);font-size:15px}
.exp .r{font-weight:900;font-size:19px;margin-bottom:4px}
.exp .r.ok{color:var(--ok)}.exp .r.ng{color:var(--ng)}
.next{display:block;width:100%;margin-top:14px;padding:15px;border:none;border-radius:16px;background:var(--ink);color:var(--paper);font-weight:800;font-size:17px}
.next:active{transform:scale(.99)}

/* 結果 */
.result{position:relative;padding:26px 18px 20px;border-radius:24px;background:var(--paper);box-shadow:var(--shadow);text-align:center;overflow:hidden}
.stamp{width:150px;height:150px;margin:10px auto 14px;border-radius:50%;display:grid;place-content:center;background:conic-gradient(var(--sub) calc(var(--p,0)*1%),var(--soft) 0);animation:stamp .45s cubic-bezier(.2,1.4,.4,1);position:relative}
.stamp::before{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--paper)}
.stamp>*{position:relative}
.stamp.good{background:conic-gradient(var(--ok) calc(var(--p,0)*1%),var(--soft) 0)}
.stamp div{font-family:var(--f-num);font-weight:900;font-size:44px;line-height:1;color:var(--ink)}
.stamp small{display:block;font-size:12.5px;font-weight:800;color:var(--sub);margin-top:4px}
@keyframes stamp{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.rank{font-size:24px;margin-bottom:4px}
.rank-sub{color:var(--sub);margin:0 0 16px;font-size:14px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{padding:13px;border-radius:16px;border:2px solid var(--line);background:var(--paper);font-weight:800;text-decoration:none;color:var(--ink);text-align:center;font-size:15px}
.btn.x{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.wide{width:100%;margin-top:10px}
.miss{margin-top:22px;text-align:left}
.miss h2{font-size:16px;margin-bottom:8px}
.miss ul{padding-left:1.2em;margin:0}
.miss li{margin-bottom:10px;font-size:14.5px}
.miss li b{display:block}
.next-app{--c:var(--kan);display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:16px;margin-top:16px;border-radius:20px;background:var(--paper);box-shadow:var(--shadow);text-decoration:none;color:var(--ink);border:2px solid color-mix(in srgb,var(--c) 35%,transparent)}
.next-app .ai{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-weight:900;font-size:20px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,var(--paper))}
.next-app b{display:block;font-size:15.5px;line-height:1.45}
.next-app small{display:block;color:var(--sub);font-size:12.5px;line-height:1.5;margin-top:2px}
.next-app .go{font-size:22px;font-weight:900;color:var(--c)}
.book{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:16px;margin-top:16px;border-radius:20px;background:var(--paper);box-shadow:var(--shadow);text-align:left;text-decoration:none;color:var(--ink)}
.book .cv{width:56px;height:80px;border-radius:6px;background:linear-gradient(160deg,#ffe28a,#f5b301);display:grid;place-items:end center;padding-bottom:6px;color:#5a4100;font-size:10px;font-weight:900;box-shadow:0 4px 10px rgba(0,0,0,.12)}
.book b{display:block;font-size:15.5px;line-height:1.45}
.book small{color:var(--sub);font-size:13px;line-height:1.5;display:block;margin-top:3px}
.book .go{font-size:13px;font-weight:800;color:var(--kan);margin-top:4px;display:block}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
.pop{animation:pop .25s ease-out}@keyframes pop{from{transform:translateY(4px);opacity:.4}to{transform:none;opacity:1}}
@media (max-width:420px){.apps{gap:10px}.app{padding:14px 13px 12px}.app .n{font-size:22px}.stage{grid-template-columns:46px 1fr auto;gap:12px}.stage .ic{width:46px;height:46px;font-size:19px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.full{font-size:.72rem;opacity:.75;line-height:1.35;margin:.1rem 0 .15rem}
</style>

<body>

<div class="tape"></div>
<main class="wrap" id="app"></main>
<canvas id="fx" hidden></canvas>

<script>
// 問題データ:[問題, [正解, まちがい, まちがい, まちがい], 解説]。最初の選択肢が正解(表示時に並べかえる)
const COURSES={
 den:{name:'第二種電気工事士',short:'電工二種',ic:'電',c:'var(--den)',lv:2,rate:'学科 約57%・技能 約72%(2025年度)',desc:'法令・接地・配線の基本',qs:[
  ['交流で「低圧」とされる電圧の範囲は?',['600V以下','300V以下','750V以下','7,000V以下'],'交流は600V以下、直流は750V以下が低圧です。'],
  ['一般の住宅で使われる「単相3線式」でとり出せる電圧は?',['100Vと200V','100Vだけ','200Vだけ','100Vと400V'],'電線3本のうち、真ん中の線と外側の線で100V、外側どうしで200Vがとれます。'],
  ['対地電圧150V以下の低圧電路で、絶縁抵抗の最低値は?',['0.1MΩ','0.2MΩ','0.4MΩ','1MΩ'],'150V以下は0.1MΩ、300V以下は0.2MΩ、300V超は0.4MΩ以上です。'],
  ['使用電圧が300Vを超える低圧電路の絶縁抵抗の最低値は?',['0.4MΩ','0.1MΩ','0.2MΩ','0.3MΩ'],'電圧が高いほど、求められる絶縁抵抗も大きくなります。'],
  ['使用電圧300V以下の機械の金属の外箱にする接地工事は?',['D種接地工事','A種接地工事','B種接地工事','C種接地工事'],'300V以下はD種、300Vを超える低圧はC種です。'],
  ['D種接地工事の接地抵抗値は、原則いくら以下?',['100Ω','10Ω','500Ω','1,000Ω'],'0.5秒以内に電気を止める漏電遮断器があれば、500Ω以下まで認められます。'],
  ['20Aの配線用遮断器の分岐回路で使う電線(銅線)の太さは?',['直径1.6mm以上','直径1.2mm以上','直径2.6mm以上','直径3.2mm以上'],'20Aの遮断器には1.6mm以上の電線、20A以下のコンセントを組み合わせます。'],
  ['30Aの配線用遮断器の分岐回路につなげるコンセントは?',['20A以上30A以下','15Aのみ','15A以上20A以下','30A以上50A以下'],'30Aの回路は電線2.6mm以上、コンセントは20A以上30A以下です。'],
  ['10Ωの抵抗に100Vをかけると、流れる電流は?',['10A','1A','100A','1,000A'],'オームの法則で、電流=電圧÷抵抗。100÷10=10Aです。'],
  ['10Ωの抵抗を2本、並列につなぐと合わせた抵抗は?',['5Ω','10Ω','20Ω','2.5Ω'],'同じ抵抗を2本並列にすると半分になります。直列なら足して20Ωです。'],
  ['電線どうしをつなぐとき、引張強さを何%以上減らしてはいけない?',['20%','5%','10%','50%'],'つないだ部分は、電気抵抗を増やさず、引張強さを20%以上減らさないことが決まりです。'],
  ['三相誘導電動機の回る向きを逆にする方法は?',['3本の線のうち2本を入れかえる','3本すべてを入れかえる','電圧を下げる','コンデンサを外す'],'どれか2本を入れかえると、回る向きが逆になります。'],
  ['「VVFケーブル」の正式な呼び名は?',['600Vビニル絶縁ビニルシースケーブル平形','600Vビニル絶縁電線','600V架橋ポリエチレン絶縁ケーブル','600Vゴム絶縁電線'],'住宅の屋内配線でいちばんよく使われる、平たい形のケーブルです。'],
  ['第二種電気工事士の免状を交付するのは?',['都道府県知事','経済産業大臣','市町村長','電力会社'],'電気工事士法で、第一種・第二種とも都道府県知事が交付すると決められています。'],
  ['絶縁抵抗を測るときに使う測定器は?',['絶縁抵抗計(メガー)','接地抵抗計(アーステスタ)','クランプメータ','検相器'],'接地抵抗計は接地の抵抗、検相器は三相の相の順番を調べる道具です。'],
  ["同じ材質・太さの電線を2倍の長さにすると、抵抗は?",["2倍","半分","4倍","変わらない"],"電線の抵抗は長さに比例します。材質・太さ・温度が同じなら、長さが2倍で抵抗も2倍です。"],
  ["銅の電線は、温度が上がると抵抗がどうなる?",["大きくなる","小さくなる","必ずゼロになる","温度には関係しない"],"銅は温度が上がると電気が流れにくくなり、抵抗が大きくなります。"],

function start(id){
  const tagged=([k,c])=>c.qs.map(q=>[...q,c.short,c.c]);
  const pool=id==='mix'?Object.entries(COURSES).flatMap(tagged):tagged([id,COURSES[id]]);
  S={id,qs:shuffle(pool).slice(0,N).map(([q,o,e,tag,c])=>({q,e,tag,c,a:o[0],o:shuffle(o)})),i:0,res:[],combo:0,maxCombo:0};
  ask();
}

function hud(){

  <div class="lamps">${S.qs.map((_,k)=>`<i class="${k<S.res.length?(S.res[k]?'ok':'ng'):k===S.i?'now':''}"></i>`).join('')}</div>`;
}

  const Q=S.qs[S.i];

function flash(kind){const f=document.createElement('div');f.className='flash '+kind;document.body.appendChild(f);setTimeout(()=>f.remove(),500);}

function answer(k){
  const Q=S.qs[S.i], ok=Q.o[k]===Q.a, bs=$.querySelectorAll('.opt'), card=document.getElementById('card');
  bs.forEach((b,j)=>{b.disabled=true;if(Q.o[j]===Q.a)b.classList.add('ok');else if(j===k)b.classList.add('ng');else b.classList.add('dim')});
  S.res.push(ok); S.combo=ok?S.combo+1:0; S.maxCombo=Math.max(S.maxCombo,S.combo);
  if(ok){const p=document.createElement('span');p.className='plus';p.textContent='正解';card.appendChild(p);flash('ok');}
  else{card.classList.add('shake');flash('ng');}
  if(navigator.vibrate)try{navigator.vibrate(ok?30:[60,40,60])}catch(e){}
  const cb=document.getElementById('combo');cb.className='combo'+(S.combo>=2?' on':'')+(S.combo>=5?' fire':'');cb.textContent=S.combo>=2?S.combo+'連続!':'';
  const lamps=$.querySelectorAll('.lamps i');lamps[S.i].className=ok?'ok':'ng';
  const last=S.i===N-1;
  document.getElementById('after').innerHTML=`<div class="exp pop"><div class="r ${ok?'ok':'ng'}">${ok?'正解!':'ざんねん'}</div>${ok?'':'答え:<b>'+Q.a+'</b><br>'}${Q.e}</div><button class="next" id="next">${last?'結果を見る':'次の問題へ'}</button>`;
  document.getElementById('next').onclick=()=>{S.i++;last?result():ask()};
  document.getElementById('next').scrollIntoView({behavior:calm?'auto':'smooth',block:'nearest'});
}

function confetti(){
  if(calm)return;
  const cv=document.getElementById('fx'), x=cv.getContext('2d');cv.hidden=false;
  const W=cv.width=innerWidth, H=cv.height=innerHeight, cols=['#16b37e','#f07818','#10a5d6','#3556b8','#f5b301'];
  const ps=Array.from({length:120},()=>({x:Math.random()*W,y:-20-Math.random()*H*.5,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,r:Math.random()*6.28,s:5+Math.random()*6,c:cols[Math.random()*5|0]}));
  let t=0;(function f(){x.clearRect(0,0,W,H);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++t<170)requestAnimationFrame(f);else{x.clearRect(0,0,W,H);cv.hidden=true}})();
}

  ${app?`<a class="next-app" href="${app.href}" style="--c:${app.c}"><span class="ai">${app.ic}</span><span><span class="lbl">次は本番の過去問で</span><b>${app.name}の過去問 ${app.n}問</b><small>${app.d}</small></span><span class="go">→</span></a>`:`<a class="next-app" href="#" id="toapps" style="--c:var(--kan)"><span class="ai">道</span><span><span class="lbl">次は本番の過去問で</span><b>4つの過去問アプリを見る</b><small>電工二種・ボイラー2級・ビル管・電験三種</small></span><span class="go">→</span></a>`}
  <a class="book" href="${book.u}" target="_blank" rel="noopener"><span class="cv">${book.v}</span><span><span class="lbl">現場の話は本でも</span><b>${book.t}</b><small>${book.s}</small><span class="go">Amazonで見る →</span></span></a>
  <div class="foot"><div class="ga-notice" style="font-size:11px;line-height:1.8;color:inherit;margin-top:8px">このサイトはアクセス数を知るためにGoogleアナリティクス(クッキーを使用)を使っています。集めるのは匿名の閲覧データだけです。</div>作:ゆっぴー(現場12年のビルメン)・<a href="https://x.com/yukkori0402" target="_blank" rel="noopener">X @yukkori0402</a><br><a href="https://docs.google.com/forms/d/e/1FAIpQLSe276M-LG0Cp4LfWRQjniNyPuPMMWwof0zu7qpM41ThlVlHqQ/viewform" target="_blank" rel="noopener">間違いの報告・ご意見はこちら</a></div>`;
  document.getElementById('again').onclick=()=>start(S.id);
  const ta=document.getElementById('toapps');if(ta)ta.onclick=e=>{e.preventDefault();home();};
  document.getElementById('home').onclick=home;
  window.scrollTo(0,0);
  if(!S.analyticsFinished){S.analyticsFinished=true;window.gtag && window.gtag('event','mini_quiz_finish',{app_name:'dojo',quiz_mode:'mini',quiz_scope:S.id,question_count:N,correct_count:score,accuracy:Math.round(score/N*100)});}
  if(score>=8)confetti();
}
home();
</script>
