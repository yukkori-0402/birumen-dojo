<title>ページが見つかりません | ビルメン資格道場</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap">
<style>
:root{color-scheme:light dark;--bg:#e8e5de;--paper:#f3f0e9;--ink:#2a2f33;--sub:#6f716c;--soft:#e4dfd4}
@media (prefers-color-scheme:dark){:root{--bg:#15191e;--paper:#1e242b;--ink:#e6ebee;--sub:#97a3ac;--soft:#272e36}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"M PLUS Rounded 1c","Yu Gothic",sans-serif;padding:24px 16px}
.card{position:relative;max-width:440px;width:100%;padding:34px 24px 26px;border-radius:24px;background:var(--paper);text-align:center;overflow:hidden}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,#16b37e 0 25%,#f07818 25% 50%,#10a5d6 50% 75%,#3556b8 75%)}
.n{font-size:56px;font-weight:900;line-height:1;color:var(--sub)}
h1{font-size:21px;margin:12px 0 8px}
p{margin:0 0 20px;color:var(--sub);font-size:14.5px;line-height:1.7}
.home{display:block;padding:14px;border-radius:16px;background:var(--ink);color:var(--paper);font-weight:800;text-decoration:none}
.apps{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.apps a{padding:11px 8px;border-radius:14px;background:var(--soft);color:var(--ink);font-weight:800;font-size:14px;text-decoration:none}
</style>
</head>
<body>
<div class="card">

  <a href="/birumen-dojo/%E9%9B%BB%E9%A8%93%E4%B8%89%E7%A8%AE/">電験三種</a>
 </div>
</div>
</body>
</html>
