<style>
/* ボイラー2級合格道場:電工二種と同じアプリ風デザイン(色は水色) */
:root{
  --bg:#f5f8fa; --paper:#ffffff; --ink:#1d2b33; --sub:#6b7a83; --line:#e2e8ec; --line-strong:#cdd7dd;
  --primary:#f07818; --primary-deep:#bb510b; --primary-soft:#fff0df; --on-primary:#ffffff;
  --sel:#8b5cf6; --sel-deep:#6b3fd6; --sel-soft:#efe8ff;
  --yellow:#ffc21a; --yellow-deep:#e59a00; --yellow-soft:#fff4cf;
  --blue-soft:#ddf0fd; --blue-deep:#1078c2; --red:#ff5a5f; --red-deep:#d63c41; --red-soft:#ffe6e6;
  --chip:#edf1f3; --shadow:0 4px 0 var(--line-strong);
  --ok:#16a06f; --ok-bg:#d9f7e8; --ng:#e5484d; --ng-bg:#ffe5e5; --mid:#d98a00;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11191f; --paper:#1a252c; --ink:#eef4f6; --sub:#9db0b8; --line:#29383f; --line-strong:#33454d;
  --primary:#ffab57; --primary-deep:#e57722; --primary-soft:#432b19; --on-primary:#06141b;
  --sel-soft:#2c2347; --yellow-soft:#3a3115; --blue-soft:#14324a; --red-soft:#3d1f22;
  --chip:#22313a; --ok:#41d69c; --ok-bg:#163a2c; --ng:#ff7b7f; --ng-bg:#40201f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11191f; --paper:#1a252c; --ink:#eef4f6; --sub:#9db0b8; --line:#29383f; --line-strong:#33454d;
  --primary:#ffab57; --primary-deep:#e57722; --primary-soft:#432b19; --on-primary:#06141b;
  --sel-soft:#2c2347; --yellow-soft:#3a3115; --blue-soft:#14324a; --red-soft:#3d1f22;
  --chip:#22313a; --ok:#41d69c; --ok-bg:#163a2c; --ng:#ff7b7f; --ng-bg:#40201f; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;font-size:16px;line-height:1.7;font-weight:500}
.band{display:none}
.wrap{max-width:640px;margin:0 auto;padding-block:16px 56px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
h1,h2,.dela{font-weight:900;margin:0;line-height:1.35}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--sel);outline-offset:3px}
.card{background:var(--paper);border:2px solid var(--line);border-radius:22px}
.label{display:block;font-size:12px;letter-spacing:.1em;color:var(--sub);font-weight:800}
.stack{display:grid;gap:14px}
.pop{animation:fade .25s ease-out}@keyframes fade{from{transform:translateY(6px);opacity:.3}to{transform:none;opacity:1}}
.pill b,.verdict,.total b,.big,.timer,.goal-ring span,.skill small,.tile small{font-family:"Nunito","M PLUS Rounded 1c",sans-serif}

/* 上のステータス */
.topbar{display:flex;gap:8px}
.pill{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:8px 6px;border-radius:14px;background:var(--paper);border:2px solid var(--line);font-size:18px;line-height:1.2;white-space:nowrap}
.pill b{font-size:19px;font-weight:900}.pill small{font-size:11px;font-weight:700}
.pill.fire{filter:grayscale(1);opacity:.7}.pill.fire.on{filter:none;opacity:1;color:#ff7a1a;border-color:#ffd8b5;background:#fff3e8}
.pill.xp{color:var(--yellow-deep);border-color:#ffe39a;background:var(--yellow-soft)}
.pill.goal{color:var(--blue-deep);border-color:#bfe2fb;background:var(--blue-soft)}
.pill.goal.done{color:var(--ok);border-color:#a8ebcf;background:var(--ok-bg)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.fire.on{background:#3a2616;border-color:#6b4220}:root:not([data-theme="light"]) .pill.xp,:root:not([data-theme="light"]) .pill.goal{border-color:var(--line-strong)}}

/* 見出し */
.hero{display:flex;gap:16px;align-items:center;margin:2px 0 2px}
.mascot{flex:none;width:84px;height:84px;border-radius:28px;display:grid;place-items:center;background:linear-gradient(145deg,#ffbb65,#f07818);box-shadow:0 5px 0 var(--primary-deep);transform:rotate(-6deg);animation:bob 3.2s ease-in-out infinite}
.mascot span{font-size:46px;line-height:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.18))}
@keyframes bob{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(-2deg) translateY(-5px)}}
.hero h1{font-size:clamp(28px,7.6vw,38px);margin:2px 0 4px}
.hero h1 em{font-style:normal;color:var(--primary)}
.hero p{margin:0;color:var(--sub);font-size:14px}.hero p b{color:var(--ink)}

/* 合格予測(圧力計メーター) */
.forecast{padding:16px 16px 12px}
.meter{display:grid;grid-template-columns:minmax(0,180px) 1fr;gap:14px;align-items:center;margin-bottom:12px}
.meter svg{width:100%;height:auto;display:block}
.meter .arc{fill:none;stroke-width:16;stroke-linecap:round}
.meter text{fill:var(--sub);font-size:10px;font-weight:800;font-family:"Nunito",sans-serif}
@media (max-width:420px){.meter{grid-template-columns:1fr}.meter svg{max-width:220px;margin:0 auto}}
.verdict{font-weight:900;font-size:22px;line-height:1.35}
.verdict.ok{color:var(--ok)}.verdict.mid{color:var(--mid)}.verdict.ng{color:var(--ng)}
.total{font-size:13px;color:var(--sub)}.total b{font-weight:900;font-size:20px;color:var(--ink)}
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:6.6em 1fr 3em;gap:8px;align-items:center;font-size:12.5px;font-weight:700}
.row span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{position:relative;height:12px;border-radius:99px;background:var(--chip)}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--primary);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.bar i.low{background:var(--ng)}
.bar b{position:absolute;top:-4px;bottom:-4px;left:40%;width:3px;border-radius:2px;background:var(--ink);opacity:.5}
.row .pct{text-align:right;font-weight:900}
.fnote{font-size:12px;color:var(--sub);margin:10px 0 0}

/* 今日の10問 */
.big-start{width:100%;display:flex;align-items:center;gap:14px;padding:16px 18px;border:0;border-radius:22px;background:var(--primary);color:var(--on-primary);box-shadow:0 6px 0 var(--primary-deep);text-align:left;transition:transform .08s,box-shadow .08s}
.big-start:active{transform:translateY(4px);box-shadow:0 2px 0 var(--primary-deep)}
.big-start .play{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.25);font-size:20px;padding-left:4px}
.big-start b{display:block;font-size:19px}.big-start small{opacity:.9;font-size:12.5px}
.goal-ring{--p:0;flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#fff calc(var(--p)*1%),rgba(255,255,255,.3) 0)}
.goal-ring span{width:34px;height:34px;border-radius:50%;background:var(--primary);display:grid;place-items:center;font-size:12px;font-weight:900}

.shead{display:flex;justify-content:space-between;align-items:baseline;margin:10px 0 0}
.shead h2{font-size:18px}.shead span{font-size:12px;color:var(--sub);font-weight:700}
/* 科目のまる */
.skills{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px}
.skill{--p:0;--c:var(--primary);display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;padding:0;transition:transform .1s}
.skill:active{transform:scale(.94)}
.skill-ring{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--chip) 0)}
.skill-icon{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-size:29px;background:var(--paper);box-shadow:inset 0 -4px 0 color-mix(in srgb,var(--c) 28%,transparent);border:3px solid color-mix(in srgb,var(--c) 40%,transparent)}
.skill b{font-size:11.5px;line-height:1.35;text-align:center;font-weight:800}
.skill small{font-size:12px;font-weight:900;color:var(--c);line-height:1}

/* タイル */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 6px 12px;border-radius:20px;border:2px solid var(--line);background:var(--paper);box-shadow:var(--shadow);transition:transform .08s,box-shadow .08s}
.tile:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line-strong)}
.tile:disabled{opacity:.5;cursor:default}
.tile-icon{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:26px;margin-bottom:4px}
.tile b{font-size:13px;font-weight:800;line-height:1.35;text-align:center}.tile small{font-size:12.5px;font-weight:900;text-align:center}
.tile.blue .tile-icon{background:var(--blue-soft)}.tile.blue small{color:var(--blue-deep)}
.tile.red .tile-icon{background:var(--red-soft)}.tile.red small{color:var(--red-deep)}
.tile.gray .tile-icon{background:var(--chip)}.tile.gray small{color:var(--sub)}

/* メニュー(模擬試験・科目) */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{display:grid;gap:2px;text-align:left;padding:15px 16px;border-radius:20px;border:2px solid var(--line);background:var(--paper);box-shadow:var(--shadow);transition:transform .08s,box-shadow .08s}
.mode:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line-strong)}
.mode b{font-size:16px}.mode small{color:var(--sub);font-size:12.5px;line-height:1.5}
.mode.main{grid-column:1/-1;background:var(--primary);color:var(--on-primary);border-color:var(--primary);box-shadow:0 5px 0 var(--primary-deep)}
.mode.main small{color:var(--on-primary);opacity:.9}
.mode:disabled{opacity:.45}
.subjs{display:grid;gap:10px}
.subj{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 15px;border-radius:18px;border:2px solid var(--line);background:var(--paper);text-align:left;box-shadow:var(--shadow)}
.subj small{color:var(--sub);font-size:12px;white-space:nowrap}
.note{font-size:12.5px;color:var(--sub);line-height:1.7}
.foot{text-align:center;font-size:12px;color:var(--sub);margin-top:24px;line-height:1.8}.foot a{color:var(--sub)}
.books{padding:14px;display:grid;gap:8px}
.book{display:grid;gap:1px;padding:12px 14px;border-radius:16px;border:2px solid var(--line);background:var(--bg);color:var(--ink);text-decoration:none}
.book small{color:var(--sub);font-size:12.5px}.book b::after{content:" ›";color:var(--primary)}

/* 問題 */
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.close{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:none;color:var(--sub);font-size:22px;font-weight:900}
.close:hover{background:var(--chip)}
.link{background:none;border:none;color:var(--sub);font-size:14px;font-weight:700;padding:6px 0}
.prog{flex:1;height:16px;border-radius:99px;background:var(--chip);overflow:hidden}
.prog i{display:block;height:100%;min-width:16px;border-radius:99px;background:var(--primary);box-shadow:inset 0 -4px 0 rgba(0,0,0,.12),inset 0 4px 0 rgba(255,255,255,.3);transition:width .35s cubic-bezier(.3,1.4,.6,1)}
.count{flex:none;font-weight:900;font-size:18px;font-family:"Nunito",sans-serif}.count small{font-size:12px}
.timer{flex:none;font-variant-numeric:tabular-nums;font-weight:900;font-size:14px;padding:5px 12px;border-radius:99px;background:var(--blue-soft);color:var(--blue-deep)}
.qcard{padding:18px 16px 16px}
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.qhead .dela{font-size:20px}
.tag{font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--primary-soft);color:var(--primary-deep)}
.tag.warn{background:var(--yellow-soft);color:var(--yellow-deep)}
.q{font-size:17px;font-weight:700;line-height:1.75;margin:0 0 16px;white-space:pre-wrap}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px 14px;border-radius:18px;border:2px solid var(--line-strong);background:var(--paper);font-size:15px;line-height:1.60;box-shadow:0 4px 0 var(--line-strong);transition:transform .08s,box-shadow .08s}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line-strong)}
.opt .k{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;border:2px solid var(--line-strong);font-weight:900;font-size:14px;font-family:"Nunito",sans-serif}
.opt.sel{border-color:var(--sel);background:var(--sel-soft);box-shadow:0 4px 0 var(--sel)}.opt.sel .k{background:var(--sel);border-color:var(--sel);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--ok-bg);box-shadow:0 4px 0 var(--ok);animation:popin .35s ease}.opt.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.ng{border-color:var(--ng);background:var(--ng-bg);box-shadow:0 4px 0 var(--ng);animation:shake .4s ease}.opt.ng .k{background:var(--ng);border-color:var(--ng);color:#fff}
.opt:disabled{cursor:default}.opt:disabled:not(.ok):not(.ng){opacity:.55}
@keyframes popin{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.exp{margin-top:16px;padding:16px;border-radius:18px;background:var(--bg);border:2px solid var(--line);font-size:15px;line-height:1.9}
.exp h3{margin:0 0 6px;font-size:16px}
.exp .law{display:block;margin-top:8px;font-size:12px;color:var(--sub)}
/* 答えたあとの帯(画面下に張りつく) */
.fb{position:sticky;bottom:10px;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;padding:14px 14px 14px 16px;border-radius:20px;background:var(--ok-bg);color:var(--ok);border:2px solid var(--ok);box-shadow:0 8px 24px rgba(0,0,0,.12);animation:rise .3s ease}
.fb.ng{background:var(--ng-bg);color:var(--ng);border-color:var(--ng)}
.fb-text{display:flex;align-items:center;gap:12px;min-width:0}
.fb-icon{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--ok);color:#fff;font-size:20px;font-weight:900}
.fb.ng .fb-icon{background:var(--ng)}
.fb b{display:block;font-size:20px;line-height:1.3}.fb p{margin:0;font-size:12.5px;font-weight:800}
.fb .btn{width:auto;flex:none;min-width:116px;background:var(--ok);box-shadow:0 4px 0 color-mix(in srgb,var(--ok) 70%,#000)}
.fb.ng .btn{background:var(--ng);box-shadow:0 4px 0 color-mix(in srgb,var(--ng) 70%,#000)}
@keyframes rise{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:16px;background:var(--primary);color:var(--on-primary);font-weight:900;font-size:16px;text-align:center;box-shadow:0 4px 0 var(--primary-deep);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--primary-deep)}
.btn.sub{background:var(--paper);color:var(--ink);border:2px solid var(--line-strong);box-shadow:0 4px 0 var(--line-strong)}
.btn.danger{background:var(--ng);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--ng) 70%,#000)}
.btn:disabled{opacity:.45}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-top:10px}
.grid button{padding:6px 0;border-radius:10px;border:2px solid var(--line);background:var(--paper);font-size:12px;font-weight:800}
.grid button.done{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-deep)}
.grid button.cur{outline:3px solid var(--yellow);outline-offset:1px}
details{margin-top:12px}
.about{margin:0}.about summary{font-size:13.5px}summary{cursor:pointer;color:var(--sub);font-size:14px;font-weight:700}
.confirm{margin-top:12px;padding:14px;border-radius:18px;border:2px solid var(--ng);background:var(--ng-bg);font-size:14.5px}

/* 結果 */
.res{padding:24px 16px 20px;text-align:center}
.res.good{background:linear-gradient(180deg,var(--primary-soft),var(--paper) 70%)}
.badge{font-size:64px;line-height:1;margin-bottom:10px;animation:popin .6s ease}
.rpills{display:flex;justify-content:center;gap:8px;margin-bottom:12px}.rpills .pill{flex:0 1 140px}
.big{font-weight:900;font-size:60px;line-height:1.2;color:var(--primary)}
.big small{font-size:22px;color:var(--sub)}
.pass{display:inline-block;margin:8px 0 4px;padding:5px 18px;border-radius:99px;font-weight:900;font-size:17px}
.pass.ok{background:var(--ok);color:#fff}.pass.ng{background:var(--ng);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:14px;text-align:left}
th,td{padding:8px 6px;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--sub);font-weight:800}
td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td .ok{color:var(--ok);font-weight:900}td .ng{color:var(--ng);font-weight:900}
.tbl{overflow-x:auto}
.miss{text-align:left;margin-top:14px}.miss li{margin-bottom:12px;font-size:14px}.miss ul{padding-left:1.1em;margin:6px 0 0}
.empty{padding:20px;text-align:center;color:var(--sub)}
/* 図(白い台紙にのせる) */
.figs{display:grid;gap:8px;margin:0 0 14px}
.figs button{padding:8px;border:2px solid var(--line);border-radius:16px;background:#fff;display:block;width:100%}
.figs img{display:block;max-width:100%;height:auto;margin:0 auto}
.figs small{display:block;font-size:11.5px;color:#6b7a83;text-align:right;margin-top:2px}
.zoom{position:fixed;inset:0;z-index:20;background:rgba(10,16,19,.92);overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.zoom img{display:block;background:#fff;max-width:none;width:min(1000px,200%);height:auto;margin:40px auto 0;border-radius:8px}
.zoom button{position:fixed;top:max(12px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));padding:8px 16px;border-radius:99px;border:none;background:#fff;color:#17232b;font-weight:900}
@media (max-width:480px){
  .pill{font-size:16px;gap:3px;padding:7px 4px}.pill b{font-size:17px}.pill small{font-size:10px}
  .mascot{width:68px;height:68px;border-radius:22px}.mascot span{font-size:38px}
  .hero{gap:12px}.hero p{font-size:13px}
  .skills{gap:12px 4px}.skill-ring{width:66px;height:66px}.skill-icon{width:54px;height:54px;font-size:26px}.skill b{font-size:11px}
  .tile b{font-size:12px}
  .fb{flex-wrap:wrap;bottom:8px}.fb .btn{width:100%}
}

<nav class="dojo-back" style="max-width:640px;margin:0 auto;padding:12px 16px 0"><a href="../index.html" style="display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:8px 18px;border-radius:999px;background:#ffd21f;color:#16120a;border:2px solid #16120a;box-shadow:0 3px 0 #a37e00;font-size:15px;font-weight:900;text-decoration:none">← 資格道場のトップへ</a></nav>
<main class="wrap" id="app"></main>

<script src="data.js"></script>
<script>
// 本番の科目・問題数・合格ライン(各科目40%、全体60%)
const SUBJ=[['ボイラーの構造','構造',10,0],['ボイラーの取扱い','取扱い',10,0],['燃料及び燃焼','燃料・燃焼',10,0],['関係法令','法令',10,0]];
const Q=(window.KAN||[]), $=document.getElementById('app');
const store={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let ST=store.get('boiler2_stats',{}); // id -> [正解回数, 不正解回数, 最後の結果1/0]
const save=()=>store.set('boiler2_stats',ST);
const SESS='boiler2_session';const saveSess=v=>store.set(SESS,v);const clearSess=()=>{try{localStorage.removeItem(SESS)}catch(e){}};
function loadSess(){const v=store.get(SESS,null);if(!v||!Array.isArray(v.ids))return null;const list=v.ids.map(id=>Q.find(x=>x.id===id));return list.every(Boolean)?Object.assign(v,{list}):null}
function resumeSess(){const v=loadSess();if(!v){clearSess();home();return}v.kind==='m'?mock(v.part,v):practice(v.list,v.title,v)}
// ゲーム要素:XP(正解10・不正解1)、日ごとの解答数、連続学習日数
let GM=store.get('boiler2_game',{xp:0,days:{}});if(!GM.days)GM.days={};
const GOAL=10;
const dayKey=(t=Date.now())=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const todayCount=()=>GM.days[dayKey()]||0;
function streak(){let n=0,t=Date.now();if(!GM.days[dayKey(t)])t-=864e5;while(GM.days[dayKey(t)]){n++;t-=864e5}return n}
// 科目ごとのアイコンと色
const ICON=[['⚙️','#f07818'],['🔧','#e5a900'],['🔥','#ec5650'],['📜','#8b5cf6']];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const K='12345';
let timerId=null;
// 図つきの問題:問題文の下に図を出し、タップで拡大
const figs=x=>x.g?`<div class="figs">${x.g.map(p=>`<button class="fig" data-src="${esc(p)}"><img src="${esc(p)}" alt="問題の図" loading="lazy"><small>タップで拡大</small></button>`).join('')}</div>`:'';
function bindFigs(){$.querySelectorAll('.fig').forEach(b=>b.onclick=()=>{const z=document.createElement('div');z.className='zoom';z.innerHTML=`<button>とじる</button><img src="${b.dataset.src}" alt="問題の図(拡大)">`;z.onclick=e=>{if(e.target.tagName==='BUTTON'||e.target===z)z.remove()};document.body.appendChild(z)})}
const stopTimer=()=>{if(timerId){clearInterval(timerId);timerId=null}};

function record(x,ok){const s=ST[x.id]||[0,0,0];ok?s[0]++:s[1]++;s[2]=ok?1:0;ST[x.id]=s;save();GM.xp+=ok?10:1;GM.days[dayKey()]=(GM.days[dayKey()]||0)+1;store.set('boiler2_game',GM)}
function subjStats(i){const qs=Q.filter(x=>x.s===i),seen=qs.filter(x=>ST[x.id]);
  // 直近の結果で正答率をみる(最後に解いたときに合っていたか)
  const ok=seen.filter(x=>ST[x.id][2]===1).length;return{total:qs.length,seen:seen.length,acc:seen.length?ok/seen.length:null}}

const YEARS=new Set(Q.map(x=>x.id.split('-')[0])).size;
// 圧力計のような半円メーター(0〜180点、108点から緑)
function gauge(score){
  const cx=110,cy=112,r=88,pt=(v,rr=r)=>{const a=Math.PI*v/180;return[(cx-rr*Math.cos(a)).toFixed(1),(cy-rr*Math.sin(a)).toFixed(1)]};
  const arc=(a,b)=>{const p=pt(a),q=pt(b);return`M${p[0]} ${p[1]}A${r} ${r} 0 0 1 ${q[0]} ${q[1]}`};
  const ticks=[0,30,60,90,108,150,180].map(v=>{const p=pt(v,r-12),q=pt(v,r-20);return`<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="var(--sub)" stroke-width="${v===108?2.5:1.2}"/>`}).join('');
  const lab=(v,t,dx)=>{const p=pt(v,r+12);return`<text x="${+p[0]+dx}" y="${+p[1]+4}" text-anchor="middle">${t}</text>`};
  const s=score==null?0:Math.max(0,Math.min(180,score)),n=pt(s,r-26);
  return`<svg viewBox="0 0 220 128" role="img" aria-label="予想得点メーター ${score==null?'まだデータなし':Math.round(score/4.5)+'点'}">
  <path class="arc" d="${arc(0,108)}" stroke="var(--chip)"/><path class="arc" d="${arc(108,180)}" stroke="var(--ok)" opacity=".85"/>
  ${score==null?'':`<path class="arc" d="${arc(0,Math.max(.5,Math.min(s,108)))}" stroke="var(--primary)"/>`}${ticks}
  ${lab(0,'0',6)}${lab(108,'24',0)}${lab(180,'40',-8)}
  <line x1="${cx}" y1="${cy}" x2="${n[0]}" y2="${n[1]}" stroke="${score==null?'var(--sub)':'var(--ink)'}" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="${cx}" cy="${cy}" r="6" fill="var(--ink)"/></svg>`;
}
function home(){
  stopTimer();
  const ss=SUBJ.map((_,i)=>subjStats(i)), seenAll=ss.reduce((a,b)=>a+b.seen,0);
  let est=0,known=true;ss.forEach((s,i)=>{if(s.acc==null)known=false;else est+=s.acc*SUBJ[i][2]});
  const low=ss.some(s=>s.acc!=null&&s.acc<.4), e=Math.round(est);
  const enough=ss.every(s=>s.seen>=5);
  const lowNames=ss.map((s,i)=>s.acc!=null&&s.acc<.4?SUBJ[i][1]:'').filter(Boolean);
  const v=!seenAll?['まずは1回解いてみましょう','']:!enough?['データ集め中','mid']:low?[`足切り注意:${lowNames.join('・')}`,'ng']:e>=24?['合格圏','ok']:e>=20?['あと少し','mid']:['これから伸ばそう','ng'];
  const weak=Object.keys(ST).filter(id=>ST[id][2]===0&&Q.some(x=>x.id===id)).length;
  $.innerHTML=`<div class="stack pop">
  <div class="topbar"><span class="pill fire ${streak()?'on':''}" title="連続学習日数">🔥<b>${streak()}</b><small>日連続</small></span><span class="pill goal ${todayCount()>=GOAL?'done':''}" title="今日解いた問題">🎯<b>${todayCount()}</b><small>今日</small></span></div>
  ${(()=>{const v=loadSess();if(!v)return '';const n=v.list.length,d=v.kind==='m'?v.ans.filter(a=>a>=0).length:v.res.length;return `<button class="resume-card" id="resume"><span class="resume-ic" aria-hidden="true">▶</span><span><b>続きから再開</b><small>${v.kind==='m'?'模擬試験':esc(v.title)} ・ ${d}/${n}問 答えた${v.kind==='m'?' ・ 制限時間は進んでいます':''}</small></span></button>`})()}<div class="hero"><div class="mascot" aria-hidden="true"><span>🔥</span></div><div><span class="label">二級ボイラー技士免許試験</span><h1>ボイラー2級<em>合格</em>道場</h1><p>公表問題 <b>${Q.length}</b>問・7回分（過去の公表問題を含む）。各科目40%＋全体60%で合格!</p></div></div>
  <section class="card forecast"><div class="meter">${gauge(known?e*4.5:null)}<div><span class="label">いまの合格予測</span><div class="verdict ${v[1]}">${v[0]}</div>
   <div class="total" style="text-align:left">${known?`予想得点 <b>${e}</b> / 40・合格ライン 24`:`解いた問題 <b>${seenAll}</b> / ${Q.length}`}</div></div></div>
   <div class="rows">${ss.map((s,i)=>`<div class="row"><span>${SUBJ[i][1]}</span><span class="bar"><i class="${s.acc!=null&&s.acc<.4?'low':''}" style="width:${s.acc==null?0:Math.round(s.acc*100)}%"></i><b></b></span><span class="pct">${s.acc==null?'—':Math.round(s.acc*100)+'%'}</span></div>`).join('')}</div>
   <p class="fnote">黒い線が各科目の合格ライン(40%)。1科目でも下回ると、合計が足りていても不合格です。</p></section>
  <button class="big-start" data-m="rand"><span class="goal-ring" style="--p:${Math.round(Math.min(1,todayCount()/GOAL)*100)}"><span>${todayCount()>=GOAL?'🎉':'▶'}</span></span><span><b>今日の10問をはじめる</b><small>${todayCount()>=GOAL?'今日の目標は達成!おかわりもどうぞ':'今日の目標まで あと'+(GOAL-todayCount())+'問'}</small></span></button>
  <div class="shead"><h2>科目をえらぶ</h2><span>タップで10問</span></div>
  <div class="skills">${SUBJ.map((s,i)=>{const t=subjStats(i),p=Math.round(t.seen/t.total*100);return `<button class="skill" data-i="${i}" style="--c:${ICON[i][1]};--p:${p}" aria-label="${s[0]}を10問練習。解いた割合${p}パーセント"><span class="skill-ring"><span class="skill-icon">${ICON[i][0]}</span></span><b>${s[1]}</b><small>${p}%</small></button>`}).join('')}</div>
  <div class="tiles"><button class="tile blue" data-m="mock"><span class="tile-icon">⏱️</span><b>模擬試験</b><small>本番形式</small></button><button class="tile red" data-m="weak" ${weak?'':'disabled'}><span class="tile-icon">🩹</span><b>苦手つぶし</b><small>${weak}問</small></button><button class="tile gray" data-m="reset"><span class="tile-icon">🗑️</span><b>記録を消す</b><small>リセット</small></button></div>
  <details class="about"><summary>出典・採点・法令について</summary><p class="note">出典：公益財団法人 安全衛生技術試験協会「公表試験問題」令和8年10月掲載・4月掲載、2025年後期・前期、2024年後期・前期、2023年後期。過去5回は、協会が過去に公表した問題（Wayback Machineに保存されていたPDF）を収録し、各問に元のURL・保存先を明記しています。問題文と選択肢は原文を収録し、PDFの○印で採点します。解説は独自作成で、協会公式の解説ではありません。公表問題は法令改正未対応の場合があります。2026年4月掲載問38・39、2025年後期問39、2024年後期問39には改正の注意・補足があります。採点は公表時の公式正答を維持します。成績はこの端末に保存されます。合格予測は学習済み問題の成績による目安です。</p><p><a href="https://www.exam.or.jp/lckohyo/" target="_blank" rel="noopener">安全衛生技術試験協会サイトへのリンク：公表試験問題</a></p></details>
  
  </div><div class="foot">出典：安全衛生技術試験協会 公表試験問題<br><a href="https://www.exam.or.jp/lckohyo/" target="_blank" rel="noopener">協会サイトへのリンク</a><br>独自解説（公式の解説ではありません）<br>作:ゆっぴー(現場12年のビルメン)・<a href="https://x.com/yukkori0402" target="_blank" rel="noopener">X @yukkori0402</a><br>作者の本:<a href="https://www.amazon.co.jp/dp/B0HMXYLK1D" target="_blank" rel="noopener">ビルメン、楽じゃなかった。</a> · <a href="https://www.amazon.co.jp/dp/B0HN65Y84V" target="_blank" rel="noopener">新人ビルメンの教科書</a><br><a href="https://docs.google.com/forms/d/e/1FAIpQLSe276M-LG0Cp4LfWRQjniNyPuPMMWwof0zu7qpM41ThlVlHqQ/viewform" target="_blank" rel="noopener">間違いの報告・ご意見はこちら</a><br>権利者の方からご連絡をいただいた場合は、すぐに公開を取りやめます。</div>`;
  $.querySelectorAll('.skill').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;practice(pick(Q.filter(x=>x.s===i),10),SUBJ[i][1])});
  $.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>({mock:mockMenu,subj:subjMenu,weak:()=>practice(pick(Q.filter(x=>ST[x.id]&&ST[x.id][2]===0),10),'苦手つぶし'),rand:()=>practice(pick(Q,10),'今日の10問'),reset:resetMenu})[b.dataset.m]());
  window.scrollTo(0,0);
  const rs=document.getElementById('resume');if(rs)rs.onclick=resumeSess;
}
// まだ解いていない問題 → まちがえた問題 → それ以外 の順に選ぶ
function pick(pool,n){const rank=x=>!ST[x.id]?0:ST[x.id][2]===0?1:2;return shuffle(pool).sort((a,b)=>rank(a)-rank(b)).slice(0,n)}

function subjMenu(){
  $.innerHTML=`<div class="pop"><div class="top"><button class="link" id="back">← もどる</button></div><h2 style="font-size:22px;margin-bottom:12px">科目を選ぶ</h2>
  <div class="subjs">${SUBJ.map((s,i)=>{const t=subjStats(i);return `<button class="subj" data-i="${i}"><span><b>${s[0]}</b><br><small>本番 ${s[2]}問・合格ライン ${Math.ceil(s[2]*.4)}問</small></span><small>${t.seen}/${t.total}問<br>${t.acc==null?'':'正答率 '+Math.round(t.acc*100)+'%'}</small></button>`}).join('')}</div></div>`;
  document.getElementById('back').onclick=home;
  $.querySelectorAll('.subj').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;practice(pick(Q.filter(x=>x.s===i),10),SUBJ[i][1])});
}

function resetMenu(){
  $.innerHTML=`<div class="pop"><div class="top"><button class="link" id="back">← もどる</button></div><div class="confirm">この端末に保存された成績(解いた記録・苦手リスト・連続日数)をすべて消します。元にもどせません。</div><div class="pair"><button class="btn sub" id="no">やめる</button><button class="btn danger" id="yes">消す</button></div></div>`;
  document.getElementById('back').onclick=document.getElementById('no').onclick=home;
  document.getElementById('yes').onclick=()=>{ST={};save();store.set('boiler2_mock',[]);GM={xp:0,days:{}};store.set('boiler2_game',GM);home()};
}

/* ---- 練習モード:1問ずつ答えと解説 ---- */
function practice(list,title,st){
  if(!list.length){$.innerHTML=`<div class="card empty">問題がありません。<br><br><button class="btn sub" id="back">もどる</button></div>`;document.getElementById('back').onclick=home;return}
  const P={list,i:st?st.i:0,res:st?st.res.slice():[],title,combo:st?st.combo:0};
  const keep=()=>saveSess({kind:'p',ids:P.list.map(x=>x.id),i:P.res.length,res:P.res,title:P.title,combo:P.combo||0});
  const show=()=>{
    const x=P.list[P.i];
    $.innerHTML=`<div class="top"><button class="pause" id="back" aria-label="中断してホームへ(続きから再開できます)">⏸ 中断</button><div class="prog"><i style="width:${P.i/P.list.length*100}%"></i></div><span class="count">${P.i+1}<small>/${P.list.length}</small></span></div>
    <div class="card qcard pop"><div class="qhead"><span class="tag">${SUBJ[x.s][1]}</span>${x.c?'<span class="tag warn">法改正の注意</span>':''}</div>
    <p class="note">${sourceNote(x)}</p><p class="q">${esc(x.q)}</p>${figs(x)}<div class="opts">${x.o.map((o,k)=>`<button class="opt" data-k="${k}"><span class="k">${K[k]}</span><span>${esc(o)}</span></button>`).join('')}</div><div id="after"></div></div>`;
    bindFigs();
    document.getElementById('back').onclick=()=>{if(P.res.length)keep();else clearSess();home()};
    $.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k,ok=k===x.a;record(x,ok);P.res.push(ok);P.combo=ok?(P.combo||0)+1:0;keep();
      $.querySelectorAll('.opt').forEach((c,j)=>{c.disabled=true;if(j===x.a)c.classList.add('ok');else if(j===k)c.classList.add('ng')});
      const last=P.i===P.list.length-1;
      document.getElementById('after').innerHTML=`<div class="exp pop"><h3>💡 独自解説（公式解説ではありません）</h3>${esc(x.e)}${x.c?`<span class="law">法改正の注意:${esc(x.c)}</span>`:''}${x.l&&x.l!=='法令外'?`<span class="law">根拠:${esc(x.l)} <a href="${x.lawurl}" target="_blank" rel="noopener">条文を確認</a></span>`:''}</div><div class="fb ${ok?'':'ng'}" role="status"><div class="fb-text"><span class="fb-icon">${ok?'✔':'✖'}</span><div><b>${ok?['すばらしい!','正解!','その調子!','バッチリ!'][P.i%4]:'正解は '+K[x.a]}</b><p>${ok?(P.combo>=2?'🔥 '+P.combo+'問連続正解!':'その調子!'):'解説を読んで次へ'}</p></div></div><button class="btn" id="next">${last?'結果を見る':'つづける'}</button></div>`;
      document.getElementById('next').onclick=()=>{P.i++;last?done():show()};
      document.querySelector('.exp').scrollIntoView({behavior:'smooth',block:'nearest'});
    });
    window.scrollTo(0,0);
  };
  const done=()=>{clearSess();
    const n=P.res.length,ok=P.res.filter(Boolean).length,miss=P.list.slice(0,n).filter((_,k)=>!P.res[k]);
    const rate=n?ok/n:0;
    $.innerHTML=`<div class="card res pop ${rate>=.60?'good':''}"><div class="badge" aria-hidden="true">${rate>=.9?'🏆':rate>=.60?'🎉':rate>=.4?'💪':'🌱'}</div><div class="rpills"><span class="pill fire on">🔥<b>${streak()}</b><small>日連続</small></span></div><span class="label">${esc(P.title)}の結果</span><div class="big">${ok}<small> / ${n}</small></div><p class="note">正答率 ${n?Math.round(ok/n*100):0}%(合格の目安は全体60%)</p>
    <div class="pair"><button class="btn" id="again">続けて10問</button><button class="btn sub" id="home">ホームへ</button></div>
    ${miss.length?`<div class="miss"><h2 style="font-size:16px">まちがえた問題</h2><ul>${miss.map(x=>`<li><b>${esc(x.q.split('\n')[0])}</b><br>正解 ${K[x.a]}:${esc(x.o[x.a])}<br><span class="note">${esc(x.e)}${x.c?`<br>法改正の注意：${esc(x.c)}`:""}</span></li>`).join('')}</ul></div>`:''}</div>`;
    const pool=P.title==='苦手つぶし'?Q.filter(x=>ST[x.id]&&ST[x.id][2]===0):SUBJ.some(s=>s[1]===P.title)?Q.filter(x=>SUBJ[x.s][1]===P.title):Q;
    document.getElementById('again').onclick=()=>practice(pick(pool,10),P.title);
    document.getElementById('home').onclick=home;window.scrollTo(0,0);
  };
  P.i>=P.list.length?done():show();
}

/* ---- 模擬試験 ---- */
function roundLabel(tag){return {'2026-10':'令和8年10月掲載','2026-04':'令和8年4月掲載','2025-10':'2025年 後期','2025-04':'2025年 前期','2024-10':'2024年 後期','2024-04':'2024年 前期','2023-10':'2023年 後期'}[tag]||tag}
function sourceNote(x){return `${roundLabel(x.year)}・問${x.n} · ${x.archive?`協会が過去に公表した問題（Wayback Machineに保存されていたPDF）<br><a href="${x.source}" target="_blank" rel="noopener">元のURL</a> · <a href="${x.archive}" target="_blank" rel="noopener">保存されたPDF</a>`:`<a href="${x.source}" target="_blank" rel="noopener">協会サイトの問題PDF</a>`}`}
function mockMenu(){
  const hist=store.get('boiler2_mock',[]);
  $.innerHTML=`<div class="pop stack"><div class="top"><button class="link" id="back">← もどる</button></div><h2 style="font-size:22px">模擬試験</h2>
  <p class="note" style="margin:0">本番と同じ科目配分で出題します。途中で答え合わせはしません。最後に科目ごとの合否と、全体の得点を出します。</p>
  <p class="note">掲載回別：各回40問・原問順</p><div class="modes"><button class="mode main" data-p="all"><b>7回から混合（40問）</b><small>各科目10問・3時間</small></button>${[...new Set(Q.map(x=>x.year))].map(tag=>`<button class="mode" data-p="${tag}"><b>${roundLabel(tag)}</b><small>40問・原問順・3時間</small></button>`).join('')}</div>
  ${hist.length?`<div class="card" style="padding:14px"><span class="label">これまでの模擬試験</span><div class="tbl"><table><tr><th>日付</th><th>範囲</th><th>得点</th><th>判定</th></tr>${hist.slice(-8).reverse().map(h=>`<tr><td>${h.d}</td><td>${h.p}</td><td class="n">${h.s}/${h.n}</td><td><span class="${h.ok?'ok':'ng'}">${h.ok?'合格':'不合格'}</span></td></tr>`).join('')}</table></div></div>`:''}</div>`;
  document.getElementById('back').onclick=home;
  $.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>mock(b.dataset.p));
}
function mock(part,st){
  const idx=SUBJ.map((s,i)=>i);
  const list=st?st.list:part==='all'?idx.flatMap(i=>shuffle(Q.filter(x=>x.s===i)).slice(0,10)):Q.filter(x=>x.year===part).sort((a,b)=>a.n-b.n);
  if(!list.length){practice([],'');return}
  const M=st?{list,ans:st.ans.slice(),i:st.i,end:st.end,part}:{list,ans:Array(list.length).fill(-1),i:0,end:Date.now()+3*3600e3,part};
  const keepM=()=>saveSess({kind:'m',ids:M.list.map(x=>x.id),ans:M.ans,i:M.i,end:M.end,part:M.part});
  const name=part==='all'?'混合':roundLabel(part);
  const tick=()=>{const t=Math.max(0,M.end-Date.now()),el=document.getElementById('timer');if(el)el.textContent='残り '+String(t/3600e3|0)+':'+String((t/60e3|0)%60).padStart(2,'0');if(!t){stopTimer();grade()}};
  const show=(confirm)=>{
    const x=M.list[M.i],done=M.ans.filter(a=>a>=0).length;
    $.innerHTML=`<div class="top"><button class="pause" id="quit" aria-label="中断してホームへ(続きから再開できます)">⏸ 中断</button><div class="prog"><i style="width:${done/M.list.length*100}%"></i></div><span class="timer" id="timer"></span></div>
    <div class="card qcard"><div class="qhead"><span class="dela">問${M.i+1}</span><span class="tag">${SUBJ[x.s][1]}</span>${x.c?'<span class="tag warn">法改正の注意</span>':''}<span class="label" style="margin-left:auto">${done}/${M.list.length} 解答済み</span></div>
    <p class="note">${sourceNote(x)}</p><p class="q">${esc(x.q)}</p>${figs(x)}<div class="opts">${x.o.map((o,k)=>`<button class="opt${M.ans[M.i]===k?' sel':''}" data-k="${k}"><span class="k">${K[k]}</span><span>${esc(o)}</span></button>`).join('')}</div>
    <div class="pair"><button class="btn sub" id="prev" ${M.i?'':'disabled'}>← 前へ</button><button class="btn" id="next">${M.i===M.list.length-1?'採点へ':'次へ →'}</button></div>
    <details><summary>問題一覧から選ぶ</summary><div class="grid">${M.list.map((_,k)=>`<button class="${M.ans[k]>=0?'done':''}${k===M.i?' cur':''}" data-j="${k}">${k+1}</button>`).join('')}</div></details>
    ${confirm?`<div class="confirm">まだ答えていない問題が ${M.list.length-done}問あります(0点になります)。採点しますか?<div class="pair"><button class="btn sub" id="cno">もどる</button><button class="btn danger" id="cyes">採点する</button></div></div>`:''}</div>`;
    keepM();tick();bindFigs();
    $.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{M.ans[M.i]=+b.dataset.k;keepM();$.querySelectorAll('.opt').forEach(c=>c.classList.toggle('sel',c===b))});
    document.getElementById('prev').onclick=()=>{M.i--;show()};
    document.getElementById('next').onclick=()=>{if(M.i<M.list.length-1){M.i++;show()}else ask()};
    document.getElementById('quit').onclick=()=>{keepM();stopTimer();home()};
    $.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{M.i=+b.dataset.j;show()});
    if(confirm){document.getElementById('cno').onclick=()=>show();document.getElementById('cyes').onclick=grade;document.querySelector('.confirm').scrollIntoView({block:'center'})}
    else window.scrollTo(0,0);
  };
  const ask=()=>M.ans.every(a=>a>=0)?grade():show(true);
  const grade=()=>{
    stopTimer();clearSess();
    M.list.forEach((x,k)=>{if(M.ans[k]>=0)record(x,M.ans[k]===x.a)});
    const rows=idx.map(i=>{const ks=M.list.map((x,k)=>k).filter(k=>M.list[k].s===i),n=ks.length,s=ks.filter(k=>M.ans[k]===M.list[k].a).length,need=Math.ceil(n*.4);return{i,n,s,need,ok:s>=need}});
    const N=M.list.length,S=rows.reduce((a,r)=>a+r.s,0),needAll=Math.ceil(N*.60),pass=S>=needAll&&rows.every(r=>r.ok);
    const hist=store.get('boiler2_mock',[]);const d=new Date();hist.push({d:`${d.getMonth()+1}/${d.getDate()}`,p:name,s:S,n:N,ok:pass});store.set('boiler2_mock',hist.slice(-30));
    const miss=M.list.map((x,k)=>({x,k})).filter(o=>M.ans[o.k]!==o.x.a);
    $.innerHTML=`<div class="card res pop"><span class="label">模擬試験(${name})の結果</span><div class="big">${S}<small> / ${N}</small></div>
    <span class="pass ${pass?'ok':'ng'}">${pass?'合格ライン突破':'不合格ライン'}</span><p class="note">全体の合格ライン ${needAll}点(60%)${rows.some(r=>!r.ok)?'。40%に届かない科目があります':''}</p>
    <div class="tbl"><table><tr><th>科目</th><th>得点</th><th>ライン</th><th></th></tr>${rows.map(r=>`<tr><td>${SUBJ[r.i][1]}</td><td class="n">${r.s}/${r.n}</td><td class="n">${r.need}</td><td><span class="${r.ok?'ok':'ng'}">${r.ok?'○':'×'}</span></td></tr>`).join('')}</table></div>
    <div class="pair"><button class="btn" id="weak">まちがえた問題を復習</button><button class="btn sub" id="home">ホームへ</button></div>
    ${miss.length?`<details><summary>まちがえた問題の答えと解説(${miss.length}問)</summary><div class="miss"><ul>${miss.map(o=>`<li><b>問${o.k+1}(${SUBJ[o.x.s][1]})${esc(o.x.q.split('\n')[0])}</b><br>あなた:${M.ans[o.k]>=0?K[M.ans[o.k]]:'未回答'} → 正解 ${K[o.x.a]}:${esc(o.x.o[o.x.a])}<br><span class="note">${esc(o.x.e)}${o.x.c?`<br>法改正の注意：${esc(o.x.c)}`:""}</span></li>`).join('')}</ul></div></details>`:''}</div>`;
    document.getElementById('weak').onclick=()=>practice(miss.map(o=>o.x).slice(0,10),'苦手つぶし');
    document.getElementById('home').onclick=home;window.scrollTo(0,0);
  };
  timerId=setInterval(tick,15000);show();
}
home();
</script>
